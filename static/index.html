<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sakshi</title>
<style>
  html, body {
    height: 100%;
    overflow: hidden;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f4f6;
    height: 100vh;
    height: 100dvh; /* fixes mobile browsers where 100vh shifts as the URL bar collapses */
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    flex-shrink: 0;
    position: sticky;
    top: 0;
    z-index: 10;
    background: #d94a90;
    color: white;
    padding: 16px;
    text-align: center;
    font-weight: 600;
    font-size: 18px;
  }

  /* ---- Auth screen ---- */
  #authScreen {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding: 24px;
    overflow-y: auto;
    min-height: 0;
  }
  #authScreen input {
    width: 100%;
    max-width: 320px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid #ccc;
    font-size: 15px;
    outline: none;
  }
  #authScreen button {
    width: 100%;
    max-width: 320px;
    background: #d94a90;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-size: 15px;
    cursor: pointer;
  }
  #authToggle {
    background: none;
    color: #d94a90;
    max-width: none;
    width: auto;
    padding: 4px;
  }
  #authError {
    color: #c0392b;
    font-size: 13px;
    min-height: 18px;
  }

  /* ---- Chat screen ---- */
  #chatScreen { display: none; flex: 1; flex-direction: column; min-height: 0; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.4;
    font-size: 15px;
    white-space: pre-wrap;
  }
  .user { align-self: flex-end; background: #ffd9ea; }
  .bot { align-self: flex-start; background: #ffffff; border: 1px solid #e5e5e5; }
  .typing { align-self: flex-start; color: #888; font-size: 13px; padding-left: 4px; }
  #inputBar {
    display: flex;
    padding: 12px;
    background: white;
    border-top: 1px solid #e0e0e0;
    gap: 8px;
  }
  #msgInput {
    flex: 1;
    padding: 12px 14px;
    border-radius: 24px;
    border: 1px solid #ccc;
    font-size: 15px;
    outline: none;
  }
  #sendBtn {
    background: #d94a90;
    color: white;
    border: none;
    border-radius: 24px;
    padding: 0 20px;
    font-size: 15px;
    cursor: pointer;
  }
  #sendBtn:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>

<header>Sakshi 💕</header>

<div id="authScreen">
  <input id="username" type="text" placeholder="Username" autocomplete="username" />
  <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
  <div id="authError"></div>
  <button id="authSubmitBtn">Login</button>
  <button id="authToggle">New here? Register instead</button>
</div>

<div id="chatScreen">
  <div id="chat"></div>
  <div id="inputBar">
    <input id="msgInput" type="text" placeholder="Type a message..." autocomplete="off" />
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
  const authScreen = document.getElementById("authScreen");
  const chatScreen = document.getElementById("chatScreen");
  const usernameEl = document.getElementById("username");
  const passwordEl = document.getElementById("password");
  const authError = document.getElementById("authError");
  const authSubmitBtn = document.getElementById("authSubmitBtn");
  const authToggle = document.getElementById("authToggle");

  const chatEl = document.getElementById("chat");
  const inputEl = document.getElementById("msgInput");
  const sendBtn = document.getElementById("sendBtn");

  let mode = "login"; // or "register"
  let token = localStorage.getItem("sakshi_token") || null;

  function showChat() {
    authScreen.style.display = "none";
    chatScreen.style.display = "flex";
    inputEl.focus();
  }

  if (token) showChat();

  authToggle.addEventListener("click", () => {
    mode = mode === "login" ? "register" : "login";
    authSubmitBtn.textContent = mode === "login" ? "Login" : "Register";
    authToggle.textContent = mode === "login" ? "New here? Register instead" : "Already have an account? Login";
    authError.textContent = "";
  });

  authSubmitBtn.addEventListener("click", async () => {
    const username = usernameEl.value.trim();
    const password = passwordEl.value;
    if (!username || !password) {
      authError.textContent = "Enter username and password.";
      return;
    }
    authError.textContent = "";
    authSubmitBtn.disabled = true;
    try {
      const res = await fetch(`/api/${mode}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) {
        authError.textContent = data.detail || "Something went wrong.";
        return;
      }
      token = data.token;
      localStorage.setItem("sakshi_token", token);
      showChat();
    } catch (err) {
      authError.textContent = "Network error, try again.";
    } finally {
      authSubmitBtn.disabled = false;
    }
  });

  function addBubble(text, cls) {
    const div = document.createElement("div");
    div.className = "bubble " + cls;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    addBubble(text, "user");
    inputEl.value = "";
    sendBtn.disabled = true;

    const typingEl = document.createElement("div");
    typingEl.className = "typing";
    typingEl.textContent = "typing...";
    chatEl.appendChild(typingEl);
    chatEl.scrollTop = chatEl.scrollHeight;

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token,
        },
        body: JSON.stringify({ message: text }),
      });
      if (res.status === 401) {
        localStorage.removeItem("sakshi_token");
        location.reload();
        return;
      }

      let data;
      try {
        data = await res.json();
      } catch {
        data = null;
      }

      typingEl.remove();

      if (!res.ok) {
        const msg = (data && data.detail) || `Server error (${res.status}). Try again in a moment.`;
        addBubble(msg, "bot");
        return;
      }
      if (!data || !data.reply) {
        addBubble("No reply came back. Try again.", "bot");
        return;
      }
      addBubble(data.reply, "bot");
    } catch (err) {
      typingEl.remove();
      addBubble("Couldn't reach the server — check your connection and try again.", "bot");
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
