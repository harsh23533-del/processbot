<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bestfriend Chatbot</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f4f6;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #4A90D9;
    color: white;
    padding: 16px;
    text-align: center;
    font-weight: 600;
    font-size: 18px;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.4;
    font-size: 15px;
    white-space: pre-wrap;
  }
  .user {
    align-self: flex-end;
    background: #DCF8C6;
  }
  .bot {
    align-self: flex-start;
    background: #ffffff;
    border: 1px solid #e5e5e5;
  }
  .typing {
    align-self: flex-start;
    color: #888;
    font-size: 13px;
    padding-left: 4px;
  }
  #inputBar {
    display: flex;
    padding: 12px;
    background: white;
    border-top: 1px solid #e0e0e0;
    gap: 8px;
  }
  #msgInput {
    flex: 1;
    padding: 12px 14px;
    border-radius: 24px;
    border: 1px solid #ccc;
    font-size: 15px;
    outline: none;
  }
  #sendBtn {
    background: #4A90D9;
    color: white;
    border: none;
    border-radius: 24px;
    padding: 0 20px;
    font-size: 15px;
    cursor: pointer;
  }
  #sendBtn:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>

<header>Bestfriend</header>
<div id="chat"></div>
<div id="inputBar">
  <input id="msgInput" type="text" placeholder="Type a message..." autocomplete="off" />
  <button id="sendBtn">Send</button>
</div>

<script>
  const chatEl = document.getElementById("chat");
  const inputEl = document.getElementById("msgInput");
  const sendBtn = document.getElementById("sendBtn");

  // One session id per browser tab (kept in memory only, not persisted).
  const sessionId = "session-" + Math.random().toString(36).slice(2, 10);

  function addBubble(text, cls) {
    const div = document.createElement("div");
    div.className = "bubble " + cls;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    addBubble(text, "user");
    inputEl.value = "";
    sendBtn.disabled = true;

    const typingEl = document.createElement("div");
    typingEl.className = "typing";
    typingEl.textContent = "typing...";
    chatEl.appendChild(typingEl);
    chatEl.scrollTop = chatEl.scrollHeight;

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });
      const data = await res.json();
      typingEl.remove();
      addBubble(data.reply, "bot");
    } catch (err) {
      typingEl.remove();
      addBubble("Something went wrong, try again.", "bot");
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
