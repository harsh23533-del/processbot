  html, body {

</style>
</head>
<body>

<div id="bgIcons"></div>

<header>
  <button id="backBtn">←</button>
  <span id="headerTitle">Friend Circle</span>
</header>

<div id="authScreen">
  <input id="username" type="text" placeholder="Username" autocomplete="username" />
  <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
  <div id="authError"></div>
  <button id="authSubmitBtn">Login</button>
  <button id="authToggle">New here? Register instead</button>
</div>

<div id="personaScreen">
  <h2>Kisse baat karni hai?</h2>
  <div class="persona-grid" id="personaGrid"></div>
</div>

<div id="chatScreen">
  <div id="chat"></div>
  <div id="voiceStatus"></div>
  <div id="inputBar">
    <button id="voiceModeBtn" class="voiceBtn" title="Start voice call">📞</button>
    <input id="msgInput" type="text" placeholder="Type a message..." autocomplete="off" />
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
  const authScreen = document.getElementById("authScreen");
  const personaScreen = document.getElementById("personaScreen");
  const chatScreen = document.getElementById("chatScreen");
  const headerTitle = document.getElementById("headerTitle");
  const backBtn = document.getElementById("backBtn");

  const usernameEl = document.getElementById("username");
  const passwordEl = document.getElementById("password");
  const authError = document.getElementById("authError");
  const authSubmitBtn = document.getElementById("authSubmitBtn");
  const authToggle = document.getElementById("authToggle");

  const personaGrid = document.getElementById("personaGrid");
  const chatEl = document.getElementById("chat");
  const inputEl = document.getElementById("msgInput");
  const sendBtn = document.getElementById("sendBtn");

  let mode = "login";
  let token = localStorage.getItem("fc_token") || null;
  let currentPersona = null;

  function showScreen(name) {
    authScreen.style.display = name === "auth" ? "flex" : "none";
    personaScreen.style.display = name === "persona" ? "block" : "none";
    chatScreen.style.display = name === "chat" ? "flex" : "none";
    backBtn.style.display = name === "chat" ? "inline-block" : "none";
    headerTitle.textContent = name === "chat" && currentPersona ? currentPersona.name : "Friend Circle";
  }

  backBtn.addEventListener("click", () => {
    currentPersona = null;
    chatEl.innerHTML = "";
    showScreen("persona");
  });

  async function loadPersonas() {
    const res = await fetch("/api/personas");
    const personas = await res.json();
    personaGrid.innerHTML = "";
    personas.forEach((p) => {
      const card = document.createElement("div");
      card.className = "persona-card";
      card.innerHTML = `
        <div class="persona-avatar">${p.avatar}</div>
        <div class="persona-name" style="color:${p.color}">${p.name}</div>
        <div class="persona-tagline">${p.tagline}</div>
      `;
      card.addEventListener("click", () => openChat(p));
      personaGrid.appendChild(card);
    });
  }

  function openChat(persona) {
    currentPersona = persona;
    chatEl.innerHTML = "";
    showScreen("chat");
    inputEl.focus();
  }

  if (token) {
    showScreen("persona");
    loadPersonas();
  }

  authToggle.addEventListener("click", () => {
    mode = mode === "login" ? "register" : "login";
    authSubmitBtn.textContent = mode === "login" ? "Login" : "Register";
    authToggle.textContent = mode === "login" ? "New here? Register instead" : "Already have an account? Login";
    authError.textContent = "";
  });

  authSubmitBtn.addEventListener("click", async () => {
    const username = usernameEl.value.trim();
    const password = passwordEl.value;
    if (!username || !password) {
      authError.textContent = "Enter username and password.";
      return;
    }
    authError.textContent = "";
    authSubmitBtn.disabled = true;
    try {
      const res = await fetch(`/api/${mode}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) {
        authError.textContent = data.detail || "Something went wrong.";
        return;
      }
      token = data.token;
      localStorage.setItem("fc_token", token);
      showScreen("persona");
      loadPersonas();
    } catch (err) {
      authError.textContent = "Network error, try again.";
    } finally {
      authSubmitBtn.disabled = false;
    }
  });

  function addBubble(text, cls) {
    const div = document.createElement("div");
    div.className = "bubble " + cls;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || !currentPersona) return;

    addBubble(text, "user");
    inputEl.value = "";
    sendBtn.disabled = true;

    const typingEl = document.createElement("div");
    typingEl.className = "typing";
    typingEl.innerHTML = `${currentPersona.name} is typing <span class="dot"></span><span class="dot"></span><span class="dot"></span>`;
    chatEl.appendChild(typingEl);
    chatEl.scrollTop = chatEl.scrollHeight;

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token,
        },
        body: JSON.stringify({ message: text, persona: currentPersona.id }),
      });
      if (res.status === 401) {
        localStorage.removeItem("fc_token");
        location.reload();
        return;
      }

      let data;
      try {
        data = await res.json();
      } catch {
        data = null;
      }

      typingEl.remove();

      if (!res.ok) {
        const msg = (data && data.detail) || `Server error (${res.status}). Try again in a moment.`;
        addBubble(msg, "bot");
        return;
      }
      if (!data || !data.reply) {
        addBubble("No reply came back. Try again.", "bot");
        return;
      }
      addBubble(data.reply, "bot");
      if (callActive) speak(data.reply);
    } catch (err) {
      typingEl.remove();
      addBubble("Couldn't reach the server — check your connection and try again.", "bot");
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  // ---- Voice call (continuous STT + TTS, automatic turn-taking, barge-in) ----
  const voiceModeBtn = document.getElementById("voiceModeBtn");
  const voiceStatus = document.getElementById("voiceStatus");

  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  const speechSupported = !!SpeechRecognitionAPI && "speechSynthesis" in window;

  let recognition = null;
  let recognitionRunning = false;
  let callActive = false;      // true from "start call" tap until "end call" tap
  let restartTimer = null;
  let voicesCache = [];

  if (!speechSupported) {
    voiceModeBtn.style.display = "none";
  } else {
    recognition = new SpeechRecognitionAPI();
    recognition.lang = "en-IN"; // handles Hinglish code-switching reasonably well
    recognition.interimResults = true;
    recognition.continuous = true; // keep the mic open for the whole call

    recognition.onstart = () => { recognitionRunning = true; };

    recognition.onresult = (event) => {
      let interim = "";
      let final = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const r = event.results[i];
        if (r.isFinal) final += r[0].transcript;
        else interim += r[0].transcript;
      }
      const live = (final + interim).trim();

      // Barge-in: if she's talking and real speech shows up, cut her off immediately.
      if (live.length > 2 && speechSynthesis.speaking) {
        speechSynthesis.cancel();
        voiceStatus.textContent = "Listening...";
      }

      if (live) inputEl.value = live;

      if (final.trim()) {
        inputEl.value = final.trim();
        sendMessage(); // recognition keeps running underneath — no button needed
      }
    };

    recognition.onerror = (event) => {
      recognitionRunning = false;
      // "no-speech" / "aborted" happen constantly in continuous mode — just keep the call alive
      if (callActive && event.error !== "not-allowed") {
        scheduleRestart();
      } else if (event.error === "not-allowed") {
        voiceStatus.textContent = "Mic permission blocked — allow mic access to use voice call.";
        endCall();
      }
    };

    recognition.onend = () => {
      recognitionRunning = false;
      if (callActive) scheduleRestart(); // browsers stop the session periodically; keep it alive
    };
  }

  function scheduleRestart() {
    clearTimeout(restartTimer);
    restartTimer = setTimeout(() => {
      if (callActive && !recognitionRunning) {
        try { recognition.start(); } catch (e) {}
      }
    }, 250);
  }

  function startCall() {
    if (!speechSupported || !currentPersona) return;
    callActive = true;
    voiceModeBtn.classList.add("on");
    voiceModeBtn.textContent = "📴";
    voiceStatus.textContent = "Call started — just talk.";
    try { recognition.start(); } catch (e) {}
  }

  function endCall() {
    callActive = false;
    voiceModeBtn.classList.remove("on");
    voiceModeBtn.textContent = "📞";
    voiceStatus.textContent = "";
    speechSynthesis.cancel();
    clearTimeout(restartTimer);
    if (recognitionRunning) recognition.stop();
  }

  voiceModeBtn.addEventListener("click", () => {
    if (callActive) endCall();
    else startCall();
  });

  if (speechSupported) {
    speechSynthesis.onvoiceschanged = () => { voicesCache = speechSynthesis.getVoices(); };
    voicesCache = speechSynthesis.getVoices();
  }

  function pickVoice(persona) {
    if (!voicesCache.length) voicesCache = speechSynthesis.getVoices();
    const female = persona && persona.id === "sakshi";

    // Priority: Hindi (India) voices first, then Indian English, then any English.
    const hiVoices = voicesCache.filter((v) => v.lang && v.lang.toLowerCase().startsWith("hi"));
    const enInVoices = voicesCache.filter((v) => v.lang && v.lang.toLowerCase() === "en-in");
    const enVoices = voicesCache.filter((v) => v.lang && v.lang.toLowerCase().startsWith("en"));

    const femaleRe = /female|zira|samantha|priya|heera|swara|google हिन्दी|google हिंदी/i;
    const maleRe = /male|david|ravi|google.*hindi.*male|hemant/i;
    const genderRe = female ? femaleRe : maleRe;

    for (const pool of [hiVoices, enInVoices, enVoices, voicesCache]) {
      if (!pool.length) continue;
      const match = pool.find((v) => genderRe.test(v.name));
      if (match) return match;
    }
    // No gender match anywhere — fall back to best available accent tier.
    return hiVoices[0] || enInVoices[0] || enVoices[0] || voicesCache[0] || null;
  }

  function speak(text) {
    if (!speechSupported || !callActive) return;
    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    const voice = pickVoice(currentPersona);
    if (voice) {
      utter.voice = voice;
      utter.lang = voice.lang;
    } else {
      utter.lang = "hi-IN";
    }
    // Tuned for a natural Indian conversational feel — not robotic-slow, not rushed.
    utter.rate = 0.93;
    utter.pitch = currentPersona && currentPersona.id === "sakshi" ? 1.12 : 0.95;
    utter.volume = 1;
    voiceStatus.textContent = `${currentPersona.name} is speaking...`;
    utter.onend = () => {
      if (callActive) voiceStatus.textContent = "Listening...";
    };
    utter.onerror = () => {
      if (callActive) voiceStatus.textContent = "Listening...";
    };
    speechSynthesis.speak(utter);
    // recognition never stopped — it's already listening in the background,
    // which is what lets barge-in interrupt her mid-sentence.
  }


  // End the call automatically when leaving a chat
  backBtn.addEventListener("click", () => {
    if (speechSupported) endCall();
  });

  // ---- Decorative floating background icons (purely visual, no app logic) ----
  (function spawnBgIcons() {
    const container = document.getElementById("bgIcons");
    const icons = ["💕", "✨", "💬", "🌸", "💖", "🎯", "🚀", "🧘"];
    const count = 14;
    for (let i = 0; i < count; i++) {
      const el = document.createElement("span");
      el.textContent = icons[Math.floor(Math.random() * icons.length)];
      el.style.left = Math.random() * 100 + "vw";
      el.style.fontSize = (14 + Math.random() * 16) + "px";
      const duration = 14 + Math.random() * 16;
      const delay = Math.random() * duration;
      el.style.animationDuration = duration + "s";
      el.style.animationDelay = "-" + delay + "s";
      container.appendChild(el);
    }
  })();
</script>

</body>
</html>
