<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friend Circle</title>
<style>
  html, body {
    height: 100%;
    overflow: hidden;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f4f6;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    flex-shrink: 0;
    position: sticky;
    top: 0;
    z-index: 10;
    background: #d94a90;
    color: white;
    padding: 16px;
    text-align: center;
    font-weight: 600;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  #backBtn {
    position: absolute;
    left: 12px;
    background: none;
    border: none;
    color: white;
    font-size: 20px;
    cursor: pointer;
    display: none;
    padding: 4px 8px;
  }

  /* ---- Auth screen ---- */
  #authScreen {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding: 24px;
    overflow-y: auto;
    min-height: 0;
  }
  #authScreen input {
    width: 100%;
    max-width: 320px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid #ccc;
    font-size: 15px;
    outline: none;
  }
  #authScreen button {
    width: 100%;
    max-width: 320px;
    background: #d94a90;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-size: 15px;
    cursor: pointer;
  }
  #authToggle {
    background: none;
    color: #d94a90;
    max-width: none;
    width: auto;
    padding: 4px;
  }
  #authError {
    color: #c0392b;
    font-size: 13px;
    min-height: 18px;
  }

  /* ---- Persona picker ---- */
  #personaScreen {
    display: none;
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    min-height: 0;
  }
  #personaScreen h2 {
    text-align: center;
    color: #333;
    font-size: 17px;
    margin: 0 0 16px;
  }
  .persona-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    max-width: 480px;
    margin: 0 auto;
  }
  .persona-card {
    background: white;
    border-radius: 16px;
    padding: 18px 12px;
    text-align: center;
    cursor: pointer;
    border: 2px solid transparent;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .persona-card:active { transform: scale(0.97); }
  .persona-avatar {
    font-size: 34px;
    margin-bottom: 8px;
  }
  .persona-name {
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 4px;
    color: #222;
  }
  .persona-tagline {
    font-size: 12px;
    color: #777;
    line-height: 1.3;
  }

  /* ---- Chat screen ---- */
  #chatScreen { display: none; flex: 1; flex-direction: column; min-height: 0; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.4;
    font-size: 15px;
    white-space: pre-wrap;
  }
  .user { align-self: flex-end; background: #ffd9ea; }
  .bot { align-self: flex-start; background: #ffffff; border: 1px solid #e5e5e5; }
  .typing { align-self: flex-start; color: #888; font-size: 13px; padding-left: 4px; }
  #inputBar {
    display: flex;
    padding: 12px;
    background: white;
    border-top: 1px solid #e0e0e0;
    gap: 8px;
  }
  #msgInput {
    flex: 1;
    padding: 12px 14px;
    border-radius: 24px;
    border: 1px solid #ccc;
    font-size: 15px;
    outline: none;
  }
  #sendBtn {
    background: #d94a90;
    color: white;
    border: none;
    border-radius: 24px;
    padding: 0 20px;
    font-size: 15px;
    cursor: pointer;
  }
  #sendBtn:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>

<header>
  <button id="backBtn">←</button>
  <span id="headerTitle">Friend Circle</span>
</header>

<div id="authScreen">
  <input id="username" type="text" placeholder="Username" autocomplete="username" />
  <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
  <div id="authError"></div>
  <button id="authSubmitBtn">Login</button>
  <button id="authToggle">New here? Register instead</button>
</div>

<div id="personaScreen">
  <h2>Kisse baat karni hai?</h2>
  <div class="persona-grid" id="personaGrid"></div>
</div>

<div id="chatScreen">
  <div id="chat"></div>
  <div id="inputBar">
    <input id="msgInput" type="text" placeholder="Type a message..." autocomplete="off" />
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
  const authScreen = document.getElementById("authScreen");
  const personaScreen = document.getElementById("personaScreen");
  const chatScreen = document.getElementById("chatScreen");
  const headerTitle = document.getElementById("headerTitle");
  const backBtn = document.getElementById("backBtn");

  const usernameEl = document.getElementById("username");
  const passwordEl = document.getElementById("password");
  const authError = document.getElementById("authError");
  const authSubmitBtn = document.getElementById("authSubmitBtn");
  const authToggle = document.getElementById("authToggle");

  const personaGrid = document.getElementById("personaGrid");
  const chatEl = document.getElementById("chat");
  const inputEl = document.getElementById("msgInput");
  const sendBtn = document.getElementById("sendBtn");

  let mode = "login";
  let token = localStorage.getItem("fc_token") || null;
  let currentPersona = null;

  function showScreen(name) {
    authScreen.style.display = name === "auth" ? "flex" : "none";
    personaScreen.style.display = name === "persona" ? "block" : "none";
    chatScreen.style.display = name === "chat" ? "flex" : "none";
    backBtn.style.display = name === "chat" ? "inline-block" : "none";
    headerTitle.textContent = name === "chat" && currentPersona ? currentPersona.name : "Friend Circle";
  }

  backBtn.addEventListener("click", () => {
    currentPersona = null;
    chatEl.innerHTML = "";
    showScreen("persona");
  });

  async function loadPersonas() {
    const res = await fetch("/api/personas");
    const personas = await res.json();
    personaGrid.innerHTML = "";
    personas.forEach((p) => {
      const card = document.createElement("div");
      card.className = "persona-card";
      card.innerHTML = `
        <div class="persona-avatar">${p.avatar}</div>
        <div class="persona-name" style="color:${p.color}">${p.name}</div>
        <div class="persona-tagline">${p.tagline}</div>
      `;
      card.addEventListener("click", () => openChat(p));
      personaGrid.appendChild(card);
    });
  }

  function openChat(persona) {
    currentPersona = persona;
    chatEl.innerHTML = "";
    showScreen("chat");
    inputEl.focus();
  }

  if (token) {
    showScreen("persona");
    loadPersonas();
  }

  authToggle.addEventListener("click", () => {
    mode = mode === "login" ? "register" : "login";
    authSubmitBtn.textContent = mode === "login" ? "Login" : "Register";
    authToggle.textContent = mode === "login" ? "New here? Register instead" : "Already have an account? Login";
    authError.textContent = "";
  });

  authSubmitBtn.addEventListener("click", async () => {
    const username = usernameEl.value.trim();
    const password = passwordEl.value;
    if (!username || !password) {
      authError.textContent = "Enter username and password.";
      return;
    }
    authError.textContent = "";
    authSubmitBtn.disabled = true;
    try {
      const res = await fetch(`/api/${mode}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) {
        authError.textContent = data.detail || "Something went wrong.";
        return;
      }
      token = data.token;
      localStorage.setItem("fc_token", token);
      showScreen("persona");
      loadPersonas();
    } catch (err) {
      authError.textContent = "Network error, try again.";
    } finally {
      authSubmitBtn.disabled = false;
    }
  });

  function addBubble(text, cls) {
    const div = document.createElement("div");
    div.className = "bubble " + cls;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || !currentPersona) return;

    addBubble(text, "user");
    inputEl.value = "";
    sendBtn.disabled = true;

    const typingEl = document.createElement("div");
    typingEl.className = "typing";
    typingEl.textContent = currentPersona.name + " is typing...";
    chatEl.appendChild(typingEl);
    chatEl.scrollTop = chatEl.scrollHeight;

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token,
        },
        body: JSON.stringify({ message: text, persona: currentPersona.id }),
      });
      if (res.status === 401) {
        localStorage.removeItem("fc_token");
        location.reload();
        return;
      }
      const data = await res.json();
      typingEl.remove();
      addBubble(data.reply, "bot");
    } catch (err) {
      typingEl.remove();
      addBubble("Something went wrong, try again.", "bot");
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
